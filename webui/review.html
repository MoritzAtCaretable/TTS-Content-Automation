<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TTS Studio · Audio prüfen</title><link rel="stylesheet" href="review.css"><script defer src="review.js"></script></head>
<body><header><div class="brand">TTS STUDIO <span>REVIEW</span></div><h1>Audios prüfen und bearbeiten</h1><p>Anhören, gezielt schneiden und freigeben. Änderungen werden auch ins Sheet geschrieben.</p><div class="toolbar"><label>Suche<input id="search" type="search" placeholder="ID, Text oder Befund"></label><label>Status<select id="filter"><option value="all">Alle Audios</option><option value="review needed">Prüfung erforderlich</option><option value="passed">Freigegeben</option><option value="sync">Synchronisierung ausstehend</option></select></label><button id="reload">Neu laden</button></div></header>
<main><div class="summary"><span id="count">Lade Audios…</span><span id="job" role="status">Verbinde…</span></div><div id="notice" role="alert" hidden></div><div id="entries"></div></main><footer>Die App muss geöffnet bleiben. Die Prüfseite läuft ausschließlich auf diesem Computer.</footer></body></html>
